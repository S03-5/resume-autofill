<script>
// ============================================================
// 1. 简历数据与 chrome API 模拟
// ============================================================
const RESUME = {
  school: "长春理工大学",
  degree: "本科",        // 学历：页面选项里正好有「本科」
  degree_name: "学士",   // 学位：页面选项里正好有「学士」
  study_mode: "全日制"   // 学习形式：页面选项写的是长写法，靠词表认
};

const MOCK = {
  settings: {
    autoFill: false,
    skipFilled: true,
    showHud: true,
    deepFill: false,        // 本页全是原生下拉，不需要深度填充
    autoAttach: false,
    useMemory: false,       // 记忆会掩盖匹配逻辑，这里关掉
    inferPosition: false,   // 岗位推断与本次验证无关
    ledgerPrompt: false,
    navAutoFill: false,
    hotkey: "command"
  },
  resumeData: RESUME,
  blocks: undefined,
  attachment: null,
  customFields: [],
  hudPos: null
};

const storageListeners = [];
const messageListeners = [];

function pickKeys(keys) {
  const out = {};
  if (!keys) return Object.assign({}, MOCK);
  if (typeof keys === "string") { out[keys] = MOCK[keys]; return out; }
  if (Array.isArray(keys)) { keys.forEach(k => { out[k] = MOCK[k]; }); return out; }
  Object.keys(keys).forEach(k => { out[k] = (MOCK[k] === undefined) ? keys[k] : MOCK[k]; });
  return out;
}

window.chrome = {
  runtime: {
    getManifest: () => ({ version: "2.2.0-test" }),
    onMessage: { addListener: fn => messageListeners.push(fn) },
    sendMessage: () => {}
  },
  storage: {
    local: {
      get: keys => Promise.resolve(pickKeys(keys)),
      set: (obj, cb) => {
        Object.assign(MOCK, obj);
        if (typeof cb === "function") cb();
        const changes = {};
        Object.keys(obj).forEach(k => { changes[k] = { newValue: obj[k] }; });
        storageListeners.forEach(fn => { try { fn(changes, "local"); } catch (e) { /* ignore */ } });
      }
    },
    onChanged: { addListener: fn => storageListeners.push(fn) }
  }
};
</script>

<script>
// ============================================================
// 2. 断言框架
// ============================================================
const results = [];
const listEl = document.getElementById("list");

const pageErrors = [];
window.addEventListener("error", e => pageErrors.push("error: " + e.message));
window.addEventListener("unhandledrejection", e => {
  pageErrors.push("rejection: " + ((e.reason && e.reason.message) || e.reason));
});

function group(title) {
  const g = document.createElement("div");
  g.className = "group-title";
  g.textContent = title;
  listEl.appendChild(g);
}

function check(name, pass, detail) {
  results.push(!!pass);
  const div = document.createElement("div");
  div.className = "item " + (pass ? "pass" : "fail");
  const mk = document.createElement("span");
  mk.className = "mk";
  mk.textContent = pass ? "✓" : "✗";
  const nm = document.createElement("span");
  nm.textContent = name;
  if (detail) {
    const dt = document.createElement("span");
    dt.className = "dt";
    dt.textContent = "（" + detail + "）";
    nm.appendChild(dt);
  }
  div.appendChild(mk);
  div.appendChild(nm);
  listEl.appendChild(div);
}

function updateSummary() {
  const bad = results.filter(r => !r).length;
  const el = document.getElementById("summary");
  el.textContent = bad
    ? "有 " + bad + " 项没过（共 " + results.length + " 项）"
    : "全部通过 " + results.length + " / " + results.length;
  el.className = bad ? "fail" : "pass";
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function send(msg) {
  return new Promise(resolve => {
    let settled = false;
    const done = r => { if (!settled) { settled = true; resolve(r); } };
    for (const fn of messageListeners) {
      try { fn(msg, {}, done); } catch (e) { /* 单个监听器异常不影响其他 */ }
    }
    setTimeout(() => done({ ok: false, reason: "内容脚本没有响应" }), 10000);
  });
}

// option 没写 value 时，value 就等于它的文字；所以 "" 表示还停在「请选择」上
function selText(id) {
  const el = document.getElementById(id);
  if (!el || el.selectedIndex < 0) return "";
  return (el.options[el.selectedIndex].textContent || "").trim();
}
function selValue(id) {
  const el = document.getElementById(id);
  return el ? el.value : "(无此元素)";
}

// ============================================================
// 3. 测试
// ============================================================
(async function run() {
 try {
  await sleep(300);

  const res = await send({ type: "HUD_FILL" });
  await sleep(200);

  group("A. 学习形式：页面选项是长写法「全国普通高等院校全日制」");
  check("填写接口返回成功", !!res && res.ok === true,
    res ? JSON.stringify(res.reason || "") : "无响应");
  check("简历「全日制」→ 选中「全国普通高等院校全日制」",
    selText("selStudyMode") === "全国普通高等院校全日制",
    "实际：" + JSON.stringify(selText("selStudyMode")));
  // 红线：字面上「非全日制」也含「全日制」三个字，绝不能被选中
  check("绝不选中语义相反的「非全日制」",
    selText("selStudyMode") !== "非全日制",
    "实际：" + JSON.stringify(selText("selStudyMode")));

  group("B. 学校 / 院校两种写法都要认");
  check("简历「全日制」→ 选中「全国普通高等学校全日制」",
    selText("selStudyMode2") === "全国普通高等学校全日制",
    "实际：" + JSON.stringify(selText("selStudyMode2")));

  group("C. 学历和学位是两个框，必须分别填对");
  check("最高学历：简历「本科」→ 选中「本科」",
    selText("selDegree") === "本科",
    "实际：" + JSON.stringify(selText("selDegree")));
  check("学位：简历「学士」→ 选中「学士」",
    selText("selDegreeName") === "学士",
    "实际：" + JSON.stringify(selText("selDegreeName")));
  // 学位下拉的第一项常常就是「无」，字面最短，绝不能被选中
  check("学位：绝不选中「无」",
    selText("selDegreeName") !== "无",
    "实际：" + JSON.stringify(selText("selDegreeName")));
  // 回归点：以前「学位」这个词算在学历字段头上，两个框会一起被填成「本科」
  check("学位框没有被学历值「本科」串味",
    selText("selDegreeName") !== "本科",
    "实际：" + JSON.stringify(selText("selDegreeName")));
  check("学历框没有被学位值「学士」串味",
    selText("selDegree") !== "学士",
    "实际：" + JSON.stringify(selText("selDegree")));

  group("D. 找不到安全匹配的仍然留空");
  check("学位：页面只有 硕士/博士，简历「学士」→ 留空",
    selValue("selDegreeName2") === "",
    "实际：" + JSON.stringify(selText("selDegreeName2")));

  group("E. 撤销要能全部还原");
  await send({ type: "UNDO_FILL" });
  await sleep(200);
  check("撤销后学习形式回到「请选择」", selValue("selStudyMode") === "",
    "实际：" + JSON.stringify(selText("selStudyMode")));
  check("撤销后学位回到「请选择」", selValue("selDegreeName") === "",
    "实际：" + JSON.stringify(selText("selDegreeName")));
  check("撤销后学历回到「请选择」", selValue("selDegree") === "",
    "实际：" + JSON.stringify(selText("selDegree")));

  group("F. 页面没有报错");
  check("整个测试过程没有未捕获的页面错误",
    pageErrors.length === 0, pageErrors.join(" | ") || "无");
 } catch (e) {
  check("测试脚本本身没有抛异常", false, e && e.message);
 } finally {
  updateSummary();
  document.body.dataset.jianliDone = "1";
 }
})();
</script>
