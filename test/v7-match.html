<script>
// ============================================================
// 1. 简历数据与 chrome API 模拟
// ============================================================
const RESUME = {
  name: "测试同学",
  degree: "本科",                    // 页面只有「全日制本科 / 非全日制本科」
  english_level: "英语四级（CET-4）", // 页面只有「英语四级」
  nationality: "汉",                 // 页面只有「汉族」
  political: "共青团员",             // 页面一个都没有 → 必须留空
  grade_ranking: "前25%"             // 页面只有前5%/前10%/前50% → 必须留空
};

const MOCK = {
  settings: {
    autoFill: false,
    skipFilled: true,
    showHud: true,
    deepFill: false,        // 本页全是原生下拉，不需要深度填充
    autoAttach: false,
    useMemory: false,       // 记忆会掩盖匹配逻辑，这里关掉
    inferPosition: false,   // 岗位推断会改期望职位，与本次验证无关
    ledgerPrompt: false,
    navAutoFill: false,
    hotkey: "command"
  },
  resumeData: RESUME,
  blocks: undefined,
  attachment: null,
  customFields: [],
  hudPos: null
};

const storageListeners = [];
const messageListeners = [];

function pickKeys(keys) {
  const out = {};
  if (!keys) return Object.assign({}, MOCK);
  if (typeof keys === "string") { out[keys] = MOCK[keys]; return out; }
  if (Array.isArray(keys)) { keys.forEach(k => { out[k] = MOCK[k]; }); return out; }
  Object.keys(keys).forEach(k => { out[k] = (MOCK[k] === undefined) ? keys[k] : MOCK[k]; });
  return out;
}

window.chrome = {
  runtime: {
    getManifest: () => ({ version: "2.0.0-test" }),
    onMessage: { addListener: fn => messageListeners.push(fn) },
    sendMessage: () => {}
  },
  storage: {
    local: {
      get: keys => Promise.resolve(pickKeys(keys)),
      set: (obj, cb) => {
        Object.assign(MOCK, obj);
        if (typeof cb === "function") cb();
        const changes = {};
        Object.keys(obj).forEach(k => { changes[k] = { newValue: obj[k] }; });
        storageListeners.forEach(fn => { try { fn(changes, "local"); } catch (e) { /* ignore */ } });
      }
    },
    onChanged: { addListener: fn => storageListeners.push(fn) }
  }
};
</script>

<script>
// ============================================================
// 2. 断言框架
// ============================================================
const results = [];
const listEl = document.getElementById("list");
let groupEl = null;

const pageErrors = [];
window.addEventListener("error", e => pageErrors.push("error: " + e.message));
window.addEventListener("unhandledrejection", e => {
  pageErrors.push("rejection: " + ((e.reason && e.reason.message) || e.reason));
});

function group(title) {
  groupEl = document.createElement("div");
  groupEl.className = "group-title";
  groupEl.textContent = title;
  listEl.appendChild(groupEl);
}

function check(name, pass, detail) {
  results.push(!!pass);
  const div = document.createElement("div");
  div.className = "item " + (pass ? "pass" : "fail");
  const mk = document.createElement("span");
  mk.className = "mk";
  mk.textContent = pass ? "✓" : "✗";
  const nm = document.createElement("span");
  nm.textContent = name;
  if (detail) {
    const dt = document.createElement("span");
    dt.className = "dt";
    dt.textContent = "（" + detail + "）";
    nm.appendChild(dt);
  }
  div.appendChild(mk);
  div.appendChild(nm);
  listEl.appendChild(div);
}

function updateSummary() {
  const bad = results.filter(r => !r).length;
  const el = document.getElementById("summary");
  el.textContent = bad
    ? "有 " + bad + " 项没过（共 " + results.length + " 项）"
    : "全部通过 " + results.length + " / " + results.length;
  el.className = bad ? "fail" : "pass";
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function send(msg) {
  return new Promise(resolve => {
    let settled = false;
    const done = r => { if (!settled) { settled = true; resolve(r); } };
    for (const fn of messageListeners) {
      try { fn(msg, {}, done); } catch (e) { /* 单个监听器异常不影响其他 */ }
    }
    setTimeout(() => done({ ok: false, reason: "内容脚本没有响应" }), 10000);
  });
}

// 下拉当前选中的文字（value 为空说明没选中任何一项）
function selText(id) {
  const el = document.getElementById(id);
  if (!el || el.selectedIndex < 0) return "";
  return (el.options[el.selectedIndex].textContent || "").trim();
}
function selValue(id) {
  const el = document.getElementById(id);
  return el ? el.value : "(无此元素)";
}
function hudShadow() {
  const host = document.getElementById("jianli-hud-host");
  return host && host.shadowRoot ? host.shadowRoot : null;
}
function reportText() {
  const s = hudShadow();
  const r = s ? s.querySelector(".report") : null;
  return r ? r.textContent.replace(/\s+/g, " ") : "";
}

// ============================================================
// 3. 测试
// ============================================================
(async function run() {
 try {
  await sleep(300);

  // ---------- A. 同义写法要能认出来 ----------
  group("A. 简历值与页面选项写法不同，也要认出来");

  const res = await send({ type: "HUD_FILL" });
  await sleep(200);

  check("填写接口返回成功", !!res && res.ok === true, res ? JSON.stringify(res.reason || "") : "无响应");

  check("学历：简历「本科」→ 选中「全日制本科」",
    selText("selDegree") === "全日制本科", "实际：" + JSON.stringify(selText("selDegree")));

  // 红线：非全日制本科 与 全日制本科 字面高度重合但语义相反，绝不能选中
  check("学历：绝不选中语义相反的「非全日制本科」",
    selText("selDegree") !== "非全日制本科", "实际：" + JSON.stringify(selText("selDegree")));

  check("英语：简历「英语四级（CET-4）」→ 选中「英语四级」",
    selText("selEnglish") === "英语四级", "实际：" + JSON.stringify(selText("selEnglish")));

  // 拓宽识别：标签写成英语水平/英语能力/语言能力，也应识别成「英语等级」并选中「四级」
  check("英语(拓宽)：标签「英语水平」→ 选中短选项「四级」",
    selText("selEnglishLevel") === "四级", "实际：" + JSON.stringify(selText("selEnglishLevel")));
  check("英语(拓宽)：标签「英语能力」→ 选中短选项「四级」",
    selText("selEnglishAbility") === "四级", "实际：" + JSON.stringify(selText("selEnglishAbility")));
  check("英语(拓宽)：标签「语言能力」→ 选中短选项「四级」",
    selText("selLanguageAbility") === "四级", "实际：" + JSON.stringify(selText("selLanguageAbility")));

  check("民族：简历「汉」→ 选中「汉族」",
    selText("selNation") === "汉族", "实际：" + JSON.stringify(selText("selNation")));

  // ---------- B. 匹配不上必须留空 ----------
  group("B. 找不到安全匹配的，一律留空（宁可不填，不能填错）");

  check("政治面貌：简历「共青团员」页面上没有 → 留空",
    selValue("selPolitical") === "", "实际：" + JSON.stringify(selText("selPolitical")));
  check("专业排名：简历「前25%」页面上没有 → 留空",
    selValue("selRank") === "", "实际：" + JSON.stringify(selText("selRank")));

  // ---------- C. 战报要把选项摊开给用户 ----------
  group("C. 战报里要能看到「这个下拉有哪些选项」");

  const pending = (res && res.pending) || [];
  const pol = pending.find(p => p.label && p.label.indexOf("政治") >= 0);
  check("政治面貌出现在「插件没填上」清单里", !!pol, pol ? pol.reason : "清单里没有");
  check("那一条带上了该下拉的全部选项",
    !!pol && Array.isArray(pol.options) && pol.options.indexOf("中共党员") >= 0 && pol.options.indexOf("群众") >= 0,
    pol && pol.options ? pol.options.join(" / ") : "没有 options");
  check("失败原因是「没有匹配」而不是「面板没打开」（能一眼分辨是匹配问题还是面板问题）",
    !!pol && /没有匹配/.test(pol.reason), pol ? pol.reason : "");

  // 战报浮层里确实渲染出了选项行
  const sr = hudShadow();
  const optRow = sr ? sr.querySelector(".report .rp-opts") : null;
  check("战报浮层里确实渲染出了「选项：」那一行",
    !!optRow, optRow ? optRow.textContent.slice(0, 50) : "没找到 .rp-opts");
  check("战报文字里包含下拉的实际选项",
    /中共党员/.test(reportText()), reportText().slice(0, 80));

  // ---------- D. 撤销后能回到原样 ----------
  group("D. 撤销要把这次填的还原回去");

  await send({ type: "UNDO_FILL" });
  await sleep(150);
  check("撤销后学历下拉回到「请选择」", selValue("selDegree") === "", "实际：" + JSON.stringify(selText("selDegree")));
  check("撤销后英语下拉回到「请选择」", selValue("selEnglish") === "", "实际：" + JSON.stringify(selText("selEnglish")));

  // ---------- E. 同一份简历数据在任何控件里判定一致 ----------
  group("E. 同一份数据在任何控件里判定一致");

  const M = window.JIANLI_MATCHER;
  const W = window.JIANLI_WIDGETS;
  check("匹配器已加载", !!M, M ? "" : "JIANLI_MATCHER 不存在");
  check("组件层已接上匹配器", !!W && typeof W.util.findBestOption === "function",
    "widgets.js 的 findBestOption 不在");
  if (M) {
    check("阈值生效：60 分以上才填（弱包含 40 分被挡掉）",
      M.pick("本科", ["成人本科"], "degree") === null, "成人本科（2/4=0.5）不该被选中");
    check("否定词判死：非全日制本科 得 0 分",
      M.score("本科", "非全日制本科", "degree").score === 0,
      "得分 " + M.score("本科", "非全日制本科", "degree").score);
  }

  check("整个测试过程没有未捕获的页面错误",
    pageErrors.length === 0, pageErrors.length ? pageErrors.join("；") : "无");

 } catch (e) {
  check("测试脚本没有中途崩溃", false, e && e.message ? e.message : String(e));
 }
 document.body.dataset.jianliDone = "1";
 updateSummary();
})();
</script>
