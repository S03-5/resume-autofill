<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>插件填表引擎冒烟测试</title>
</head>
<body>
  <h2>模拟招聘网站表单</h2>
  <form>
    <div><label>姓名</label><input placeholder="请输入姓名"></div>
    <div><label>手机号</label><input placeholder="请输入手机号"></div>
    <div><label>邮箱</label><input placeholder="请输入邮箱"></div>
    <div><label>毕业院校</label><input placeholder="请输入毕业院校"></div>
    <div><label>专业</label><input placeholder="请输入专业"></div>
    <div><label>最高学历</label>
      <select name="degree">
        <option value="">请选择</option>
        <option value="1">大专</option>
        <option value="2">本科</option>
        <option value="3">硕士</option>
      </select>
    </div>
    <div><label>期望职位</label><input placeholder="请输入期望职位"></div>
    <div><label>自我评价</label><textarea placeholder="自我评价（选填）"></textarea></div>
    <div><label>项目经历</label><div contenteditable="true" role="textbox"></div></div>
    <div><label>密码</label><input type="password" placeholder="请输入密码"></div>
    <div><label>验证码</label><input placeholder="请输入手机验证码"></div>
  </form>

  <pre id="out">测试中…</pre>
  <pre id="checks"></pre>

  <script>
    // 模拟扩展环境（content.js 依赖的 chrome API）
    window.chrome = {
      runtime: {
        onMessage: {
          addListener: function (fn) { window.__testListener = fn; }
        }
      },
      storage: {
        local: {
          get: function () { return Promise.resolve({ settings: { autoFill: false } }); },
          set: function () {}
        }
      }
    };
  </script>
  <script src="../content/lexicon.js"></script>
  <script src="../content/matcher.js"></script>
  <script src="../content/sites.js"></script>
  <script src="../content/content.js"></script>
  <script>
    // 模拟招聘网站（zhipin.com 适配器）与智能识别的混合场景
    const testData = {
      name: "张三",
      phone: "13800138000",
      email: "zhangsan@example.com",
      school: "示例大学",
      major: "计算机科学与技术",
      degree: "本科",
      position: "软件工程师",
      intro: "这是一段示例自我介绍，用于测试插件填写效果。",
      project: "示例项目一\n示例项目二"
    };

    window.__testListener(
      { type: "FILL_PAGE", data: testData, mode: "manual" },
      null,
      function (resp) {
        document.getElementById("out").textContent =
          "filled=" + resp.filled + " total=" + resp.total + " adapter=" + resp.adapter + "\n" +
          JSON.stringify(resp.results, null, 2);

        const q = function (sel) {
          const el = document.querySelector(sel);
          return el ? el.value || el.textContent : "N/A";
        };
        document.getElementById("checks").textContent = JSON.stringify({
          name: q('input[placeholder="请输入姓名"]'),
          phone: q('input[placeholder="请输入手机号"]'),
          email: q('input[placeholder="请输入邮箱"]'),
          school: q('input[placeholder="请输入毕业院校"]'),
          major: q('input[placeholder="请输入专业"]'),
          degree: q('select[name="degree"] option:checked') + " / value=" + q('select[name="degree"]'),
          position: q('input[placeholder="请输入期望职位"]'),
          intro: q('textarea[placeholder="自我评价（选填）"]'),
          project: q('[contenteditable="true"]'),
          passwordLeaked: document.querySelector('input[type="password"]').value
        }, null, 2);
      }
    );
  </script>
</body>
</html>
